name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:gui
      - name: Verify committed GUI bundle
        run: git diff --exit-code -- dist/gui-experimental.cjs
      # Moderate inherited SDK advisories are documented in SECURITY.md.
      - run: bun audit --audit-level=high
