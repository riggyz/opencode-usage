name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(git log -1 --format=%s)" = "chore(release): $tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.release == 'true'
        with:
          bun-version: 1.3.14
      - name: Validate release
        if: steps.version.outputs.release == 'true'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build:gui
          git diff --exit-code -- dist/gui-experimental.cjs
          bun audit --audit-level=high
      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a release; skipping"
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$TAG" > /dev/null 2>&1; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::Existing tag $TAG points to another commit"
              exit 1
            fi
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Install with:

          \`\`\`sh
          opencode plugin add github:${{ github.repository }}#$TAG
          \`\`\`

          Includes the prebuilt desktop bundle. Credentials and account data remain in OpenCode, outside this repository."
