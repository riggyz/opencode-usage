name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, validate and rebuild
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          branch="release/$TAG"
          git switch -c "$branch"
          git add package.json bun.lock dist/gui-experimental.cjs
          git commit -m "chore(release): $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): $TAG" \
            --body "Bumps the plugin to \`$TAG\` and includes its rebuilt GUI bundle.

          Merging this pull request with its release title tags the merged commit and creates the GitHub Release after validation. GitHub installs need no install-time build.

          ***Created by Ethan's Agent*** 🚆"
          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows automatically.
          gh workflow run check.yml --ref "$branch"
